# Docker Compose file for CentralWatch Infrastructure
# Sets up the OpenTelemetry Collector and Prometheus in a dedicated network.
version: '3.8'

services:
  # OpenTelemetry Collector Service
  # Receives telemetry from the FastAPI application via OTLP and exposes a Prometheus scrape endpoint.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.95.0
    container_name: centralwatch-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./configs/collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "8889:8889" # Prometheus exporter metrics endpoint (optional exposure, but useful for host-level verification)
    networks:
      - centralwatch-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Prometheus Service
  # Scrapes metrics from the OpenTelemetry Collector and stores them.
  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: centralwatch-prometheus
    restart: unless-stopped
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-storage:/prometheus
    ports:
      - "9090:9090" # Prometheus Web UI & Scrape endpoint
    networks:
      - centralwatch-network
    depends_on:
      - otel-collector
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Loki Service
  # Stores logs and provides LogQL querying capability.
  loki:
    image: grafana/loki:2.9.4
    container_name: centralwatch-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./configs/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-storage:/loki
    ports:
      - "3100:3100" # Loki HTTP API & Grafana source endpoint
    networks:
      - centralwatch-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Tempo Service
  # Stores traces and provides trace search capabilities.
  tempo:
    image: grafana/tempo:2.3.1
    container_name: centralwatch-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./configs/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-storage:/var/tempo
    ports:
      - "3200:3200" # Tempo HTTP/ready and search API
    networks:
      - centralwatch-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Grafana Service
  # Visualization dashboard for Metrics (Prometheus), Logs (Loki), and Traces (Tempo).
  grafana:
    image: grafana/grafana:10.2.3
    container_name: centralwatch-grafana
    restart: unless-stopped
    ports:
      - "3000:3000" # Grafana Web UI
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-storage:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - centralwatch-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Dedicated bridge network for secure container-to-container communication
  centralwatch-network:
    driver: bridge

volumes:
  # Persistent volume for Prometheus metrics data
  prometheus-storage:
  # Persistent volume for Loki logs data
  loki-storage:
  # Persistent volume for Tempo traces data
  tempo-storage:
  # Persistent volume for Grafana configurations/dashboards
  grafana-storage:
