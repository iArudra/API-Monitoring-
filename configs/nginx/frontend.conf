# CentralWatch frontend (nginx) — serves the prebuilt React SPA and proxies
# API calls to the FastAPI backend. The SPA calls /api/* (axios baseURL), while
# the backend routes live at /* — the /api/ prefix is stripped here, so the
# backend never needs an /api prefix. This keeps the monitoring stack a
# bystander: no telemetry ever passes through nginx.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API reverse proxy (same-origin, so no CORS is required).
    # NOTE: do not add a regex location matching ^/api/ — regex locations
    # shadow this prefix location and break the proxy.
    location /api/ {
        proxy_pass http://demo-app:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        add_header Cache-Control "no-store";
    }

    # SPA fallback (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
